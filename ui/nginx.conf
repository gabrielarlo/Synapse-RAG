server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Match API MAX_UPLOAD_MB (50); nginx default 1m rejects uploads first.
    client_max_body_size 50m;

    # API reverse proxy: the Vue app calls relative /api/... in prod.
    # resolver + variable: re-resolve api on every request so recreating
    # the api container (new IP) never leaves nginx pointing at a dead one.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream api:8000;
        proxy_pass http://$upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
