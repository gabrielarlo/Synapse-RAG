<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Synapse RAG">
  <rect width="32" height="32" rx="6" fill="#0a0f1e"/>
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="gc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </radialGradient>
  </defs>
  <!-- four curved arms -->
  <path d="M 9.5 10.2 C 9.5 12.8 11.8 14.3 13.7 15" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 22.5 9.2 C 20.0 10.0 18.6 12.2 18.1 13.9" stroke="url(#g1)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 9.5 22.1 C 12.0 21.4 13.7 19.2 14.2 18.1" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 22.8 22.8 C 22.8 20.2 20.5 18.6 18.6 17.9" stroke="url(#g2)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- small end nodes -->
  <circle cx="8.5" cy="8.5" r="2.1" fill="#22d3ee"/>
  <circle cx="24.6" cy="8.4" r="2.1" fill="#8b5cf6"/>
  <circle cx="8.3" cy="23.4" r="2.1" fill="#8b5cf6"/>
  <circle cx="23.8" cy="24.4" r="2.1" fill="#22d3ee"/>
  <!-- central node -->
  <circle cx="16" cy="16" r="4.2" fill="url(#gc)" stroke="#7dd3fc" stroke-width="0.7" opacity="0.98"/>
  <circle cx="16" cy="16" r="4.2" fill="none" stroke="#22d3ee" stroke-width="0.3" opacity="0.25"/>
</svg>
